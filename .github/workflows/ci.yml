name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Project-3/app
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd Project-3/app
          pytest -v
      - name: Build deployment package
        run: |
          cd Project-3
          zip -r project-3-build.zip app -x "app/.venv/*" "app/__pycache__/*" "app/.pytest_cache/*"
      - name: Deploy application
        run: |
          mkdir -p deployment
          unzip -q Project-3/project-3-build.zip -d deployment
          echo "Application deployed successfully"
          ls -la deployment/app
